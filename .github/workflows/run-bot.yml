name: Daily `bot` run

on:
  schedule:
    - cron: '01 01 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['bot/**', 'scrapers/**', 'pyproject.toml']
  pull_request:
    paths: ['bot/**', 'scrapers/**', 'pyproject.toml']

# Read-only by default: lint-and-test also runs the code of pull requests.
# Only the job that pushes the daily update gets write access.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev
      - run: poetry run ruff check bot/ scrapers/
      - run: poetry run black --check bot/ scrapers/
      - run: poetry run pytest bot/tests/ scrapers/tests/ -v

  daily-bot-run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: lint-and-test
    runs-on: ubuntu-latest
    # one client at a time on *.azores.gov.pt (rate limits: bot/gov.py)
    concurrency:
      group: azores-gov
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Run bot
        run: poetry run python -m bot
      - name: Run AO scraper
        run: |
          printf '[credentials]\nemail = %s\npassword = %s\n' \
            "$AO_EMAIL" "$AO_PASSWORD" > .ao_config
          poetry run python3 -m scrapers.ao --date "$(date +%Y-%m-%d)"
        env:
          AO_EMAIL: ${{ secrets.AO_EMAIL }}
          AO_PASSWORD: ${{ secrets.AO_PASSWORD }}
      - name: Configure git
        run: |
          git config --global user.name "fmesqg-auto"
          git config --global user.email "fmesqg-auto@users.noreply.github.com"
      - name: Commit and push if there are changes
        run: |
          if [ $(git ls-files -o --exclude-standard | wc -l) -gt 0 ] || [[ $(git diff --name-only | wc -l) -gt 0 ]]
          then
            git add .
            git commit -m "Daily bot update"
            git push origin main
            echo "Wrote update."
          else
            echo "Nothing to write."
          fi

  deploy-site:
    needs: daily-bot-run
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
