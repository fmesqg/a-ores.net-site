name: Weekly BASE contracts (IMPIC open data)

# Reads every contratos<ano>.zip that the IMPIC publishes on dados.gov.pt
# (all BASE contracts since 2012, about 0.8 GB zipped) with
# bot/base_impic.py, keeps the contracts executed in the Azores and rewrites
# data/base_impic/<ano>.csv.gz. bot/datasets.py builds /dados/ and
# contratos.db from them alone (2012 onwards). The IMPIC
# refreshes the files every few weeks; only the recent years change, so a
# run usually commits one or two small files.
#
# The run fails, and GitHub emails, when dados.gov.pt does not list the
# files, a year has no Azores contracts, or the newest contract is more
# than ~90 days old.

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install ijson==3.4.0
      - name: Read the IMPIC files
        run: python3 -u bot/base_impic.py data
      - name: Commit and push if changed
        id: commit
        uses: ./.github/actions/commit-data
        with:
          paths: data/base_impic
          message: "BASE contracts (IMPIC) weekly update"

  deploy-site:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
