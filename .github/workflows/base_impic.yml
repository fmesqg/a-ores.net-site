name: Monthly BASE history (IMPIC open data)

# Reads every contratos<ano>.zip that the IMPIC publishes on dados.gov.pt
# (all BASE contracts since 2012, about 0.8 GB zipped) with
# bot/base_impic.py, keeps the contracts executed in the Azores and rewrites
# data/base_impic/<ano>.csv.gz. bot/datasets.py joins them with what the
# daily bot saw, so /dados/ and acores.db cover 2012 onwards. The IMPIC
# refreshes the files every few weeks; only the recent years change, so a
# run usually commits one or two small files.
#
# The run fails, and GitHub emails, when dados.gov.pt does not list the
# files, a year has no Azores contracts, or the newest contract is more
# than ~90 days old.

on:
  schedule:
    - cron: '41 3 9 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install ijson==3.4.0
      - name: Read the IMPIC files
        run: python3 -u bot/base_impic.py data
      - name: Commit and push if changed
        id: commit
        run: |
          git add -A data/base_impic
          if git diff --cached --quiet; then
            echo "Nothing to write."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config --global user.name "fmesqg-auto"
            git config --global user.email "fmesqg-auto@users.noreply.github.com"
            git commit -m "BASE history (IMPIC) monthly update"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-site:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
