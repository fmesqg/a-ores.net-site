name: Weekly IFAP update (CAP and POSEI payments)

# Reads, with bot/ifap.py, the IFAP's yearly list of CAP beneficiaries
# (FEAGA_FEADER_<ano>.zip, ~12 MB each, the two financial years the IFAP
# publishes), keeps those with an Azorean address and rewrites
# data/ifap_pagamentos.csv (names, only the years still published) and
# data/ifap_resumo.csv (totals per concelho and measure, every year read).
# The IFAP publishes a new year once a year, around May; weekly is enough.
# Not an Azores government site, so the azores-gov limit does not apply.
#
# The run fails, and GitHub emails, when no year can be read or a year's
# Azores total is implausibly low (ifap.MIN_TOTAL).

on:
  schedule:
    - cron: '41 6 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read the IFAP beneficiaries
        id: fetch
        run: python3 bot/ifap.py data
        continue-on-error: true
      - name: Commit and push if changed
        id: commit
        uses: ./.github/actions/commit-data
        with:
          paths: data/ifap_pagamentos.csv data/ifap_resumo.csv
          message: "IFAP weekly update"
      - name: Fail if a year could not be read
        if: steps.fetch.outcome == 'failure'
        run: exit 1

  deploy-site:
    needs: fetch
    if: always() && needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
