name: Weekly BEO update

# Adds new Boletins de Execução Orçamental (the regional government's monthly
# budget execution, bot/beo.py) to data/beo.csv and, when it changed, commits
# it and redeploys the site so /dados/beo/ picks it up. A boletim comes out
# by the end of the following month, so weekly is enough.
#
# The run fails, and GitHub emails, when the PDFs cannot be read or no new
# boletim has turned up for ~3 months: usually a new year whose folder is
# missing from beo.FOLDERS (copy a January link from portal.azores.gov.pt).

on:
  schedule:
    - cron: '37 4 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pypdf==7.2.0
      - name: Fetch new boletins
        run: python3 bot/beo.py data
      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- data/beo.csv; then
            echo "Nothing to write."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config --global user.name "fmesqg-auto"
            git config --global user.email "fmesqg-auto@users.noreply.github.com"
            git add data/beo.csv
            git commit -m "BEO weekly update"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-site:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
