name: Build and deploy site

# The site is built here instead of by the legacy "deploy from branch" Pages
# builder, so the generated open data (docs/dados/: CSVs, the <tema>.db files,
# meta.json, from bot/datasets.py) is published without being committed.
# Requires Settings → Pages → Source: "GitHub Actions".
#
# Triggers: pushes to main (posts, layouts, code), a manual run, and a call
# from the daily bot run after it commits (its push uses GITHUB_TOKEN, which
# does not trigger other workflows).

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main # when called by the bot, pick up the commit it just pushed
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build open datasets (docs/dados/)
        run: python3 bot/datasets.py docs
      - uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
