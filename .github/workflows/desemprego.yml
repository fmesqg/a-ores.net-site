name: Weekly registered unemployment update

# Looks for the regional employment directorate's new monthly summaries
# (bot/desemprego.py) and adds them to data/desemprego.csv; when it changed,
# commits it and redeploys the site. A summary comes out one to two months
# after its month, so weekly is enough.
#
# The run fails, and GitHub emails, when a summary does not parse (its
# layout changed), when the site answers with a Cloudflare challenge, or
# when no new month has been found for MAX_IDADE days: the file got a name
# the script does not guess, so add its address to CONHECIDOS.

on:
  schedule:
    # Tuesday 21:23 UTC: outside the government's peak hours (07:00-20:00
    # Azores time), before the daily run usually starts
    - cron: '23 21 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # one client at a time on *.azores.gov.pt (rate limits: bot/gov.py)
    concurrency:
      group: azores-gov
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install pypdf==7.2.0
      - name: Fetch registered unemployment
        id: fetch
        run: python3 bot/desemprego.py data
        continue-on-error: true
      - name: Commit and push if changed
        id: commit
        uses: ./.github/actions/commit-data
        with:
          paths: data/desemprego.csv
          message: "Registered unemployment weekly update"
      - name: Fail if a summary could not be read
        if: steps.fetch.outcome == 'failure'
        run: exit 1

  deploy-site:
    needs: fetch
    if: always() && needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
