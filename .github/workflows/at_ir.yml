name: AT IRS and IRC statistics (Dossier Estatístico)

# Reads every IRS and IRC "Dossier Estatístico" on the Portal das Finanças
# with bot/at_ir.py and rewrites data/at_irs.csv (IRS by tax bracket and
# region, additional solidarity rate, general rates), data/at_irc.csv (IRC
# at the regional rate, state surcharge, nominal rates) and
# data/at_distritos.csv (the "por distrito" maps of both). The AT publishes
# new editions once a year, between late March and mid April, so the run is
# weekly from March to May and monthly otherwise. A run costs about twenty
# requests to info.portaldasfinancas.gov.pt, two seconds apart.
#
# The run fails, and GitHub emails, when a page lists no dossier, an
# edition cannot be read (the tables changed layout), or the newest year
# is more than two years old.

on:
  schedule:
    - cron: '17 5 * 3-5 2'
    - cron: '17 5 2 1,2,6-12 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install openpyxl==3.1.5
      - name: Read the IRS and IRC dossiers
        run: python3 bot/at_ir.py data
      - name: Commit and push if changed
        id: commit
        uses: ./.github/actions/commit-data
        with:
          paths: data/at_distritos.csv data/at_irc.csv data/at_irs.csv
          message: "AT IRS/IRC statistics update"

  deploy-site:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
