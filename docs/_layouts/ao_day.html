---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">
      {{ page.article_count }} artigos ·
      <a href="{{ '/ao/' | relative_url }}">todas as edições</a>
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
