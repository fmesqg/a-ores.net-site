theme: minima

minima:
  skin: solarized

header_pages:
  - introducao.md
  - ine.md
  - financas.md
  - economia.md
  - dados.md
  - atualizacoes.md

plugins:
  - jekyll-feed

title: Açores.net
lang: pt-PT
description: Dados públicos sobre os Açores, num só sítio e explicados
collections:
  alra_updates:
    output: true
    permalink: /alra_updates/:path/
  joraa_updates:
    output: true
    permalink: /joraa_updates/:path/
  base_updates:
    output: true
    permalink: /base_updates/:path/
  portal_updates: ~
  ao:
    output: true
    permalink: /ao/:path/
  authors:
    output: true
    permalink: /blog/:path/

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "ao"
    values:
      noindex: true
